<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Needed so Materialize's responsive grid works on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment: The Materialize</title>

  <!-- Material Icons (for nav icons, buttons, etc.) -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>

<body>
  <div class="container">
    <nav>
      <div class="nav-wrapper purple">
        <a href="#" class="brand-logo">Logo</a>
        <ul id="nav-mobile" class="right hide-on-med-and-down">
          <li><a href="#">Christine</a></li>
          <li><a href="#">Robbie</a></li>
          <li><a href="#">Sue</a></li>
        </ul>
      </div>
    </nav>
    <h1 class="center-align">Hello Materialize 👋</h1>
    <a class="btn-floating btn-large waves-effect waves-light purple"><i class="material-icons">add</i></a>
    <a class="btn-floating btn-large waves-effect waves-light purple"><i class="material-icons">delete</i></a>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Christine</td>
          <td>54</td>
        </tr>
        <tr>
          <td>Robbie</td>
          <td>66</td>
        </tr>
        <tr>
          <td>Sue</td>
          <td>74</td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Materialize JS (needed for interactive components: dropdowns, modals, mobile nav) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
