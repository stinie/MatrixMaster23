<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment 2: Time to Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <nav>
        <ul>
          <li>
            <a href="#">About</a>
          </li>
          <li>
            <a href="#">Contact</a>
          </li>
        </ul>
      </nav>
      <div>
        <h1>Assignments</h1>
        <p>A list of all assignments</p>
        <table>
          <thead>
            <tr>
              <th>Assignment 1</th>
              <th>Assignment 2</th>
              <th>Assignment 3</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <a
                  href="https://github.com/stinie/MatrixMaster23/blob/main/html/fix-indentation/index.html"
                  target="_blank"
                  >Fix Indentation</a
                >
              </td>
              <td>
                <a
                  href="https://github.com/stinie/MatrixMaster23/blob/main/html/code-validation/index.html"
                  target="_blank"
                  >Code Validation</a
                >
              </td>
              <td>
                <a href="#" target="_blank">Your first website</a>
              </td>
            </tr>
          </tbody>
        </table>
        <br /><br />
        <span>Apply for a new assignment</span>
        <form action="#" method="POST">
          <label for="assignments">Select your CSS assignments</label>
          <select id="assignments" name="assignments">
            <option value="assignment4">The Evil Hacker</option>
            <option value="assignment5">Google</option>
          </select>
          <div>
            <label for="name">Full name:</label>
            <input type="text" id="name" name="name" />
          </div>
          <div>
            <input
              type="checkbox"
              id="subscribe"
              name="subscribe"
              value="subscribe"
            />
            <label>Subscribe to my newsletter?</label>
          </div>
          <div>
            <label>HTML news</label>
            <input type="radio" id="html-news" name="newsletter" value="html" />
            <label>CSS news</label>
            <input type="radio" id="css-news" name="newsletter" value="css" />
          </div>
          <div>
            <br /><br />
            <input type="submit" value="submit" />
          </div>
        </form>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
