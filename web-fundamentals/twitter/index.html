<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Assignment 1: Twitter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="sign-in-dialog">
       <div id="dialog-top">
        <button type="button">
          ×
        </button>
       </div>
       <div id="dialog-middle">
          <h1>Sign in to Twitter</h1>
          <form action="#" method="POST">
          <button type="button">
              <img src="google.png" alt="Google">
              Sign in with Google
          </button>
          </form>
          <form action="#" method="POST">
          <button type="button">
              <img src="apple.png" alt="Apple">
              <b>Sign in with Apple</b>
          </button>
        </form>
          <div>
            <hr>
            <span>or</span>
          </div>
          <form action="#" method="POST" id="next-form">
            <input type="text" placeholder="Phone, email, or username">
            <button type="submit">Next</button>
          </form>
          <form action="#" method="POST">
          <button>
            <b>Forgot password?</b>
          </button>
          </form>
       </div>
       <div id="dialog-bottom">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </div>
  </body>
</html>
